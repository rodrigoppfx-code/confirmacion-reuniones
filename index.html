<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserva tu reunión con Avovite y recibe una confirmación personalizada en video.">
  <meta name="theme-color" content="#1C4423">
  <title>Agenda tu reunión — Avovite</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
  /* ═══════════════════════════════════════════════════════════════
     ZONA DE CONFIGURACIÓN PÚBLICA
     La disponibilidad, API, avatar y voz se cambian en Google Sheet.
     ═══════════════════════════════════════════════════════════════ */
  const CONFIG = {
    SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzedp-82NmbrCDuqiXGN_fm9Va8HVYRPZPwr7QpiPk1lMKXighrm_UakulsrVwHzLWV/exec",
    TITULO: "Agenda tu reunión",
    SUBTITULO: "Reserva tu espacio.",
    BOTON: "Confirmar mi reunión",
    MENSAJE_EXITO_TITULO: "¡Tu reunión quedó confirmada!",
    MENSAJE_EXITO_TEXTO: "En un momento recibirás un video personalizado por parte de nuestro equipo con la confirmación de tu reunión."
  };
  /* ═══════════════════ FIN DE LA CONFIGURACIÓN ═══════════════════ */
  </script>

  <style>
    :root {
      --verde-hoja:#1C4423;
      --verde-fruto:#5FA832;
      --crema:#F3E5A5;
      --terracota:#B05B2C;
      --blanco:#FFFFFF;
      --texto:#22301F;
      --texto-suave:#5C6B57;
      --borde:#DCE3D6;
      --error:#9F2D24;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(160deg,#F7F5EC 0%,#EFF3E8 100%);
      color:var(--texto);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .tarjeta {
      display:grid;
      grid-template-columns:420px 1fr;
      width:100%;
      max-width:960px;
      background:var(--blanco);
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 24px 60px rgba(28,68,35,.16);
    }
    .panel {
      position:relative;
      background:var(--verde-hoja);
      color:var(--crema);
      padding:52px 44px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      overflow:hidden;
    }
    .panel svg.surcos { position:absolute; bottom:-30px; left:-40px; width:130%; opacity:.16; }
    .logo-caja {
      width:96px;
      height:96px;
      border-radius:24px;
      background:var(--blanco);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 22px rgba(0,0,0,.22);
    }
    .logo-caja img { width:76px; height:76px; object-fit:contain; }
    .panel h1 {
      font-family:'Fraunces',serif;
      font-weight:600;
      font-size:clamp(28px,3.4vw,38px);
      line-height:1.15;
      margin-top:34px;
      letter-spacing:-.01em;
    }
    .panel .sub { margin-top:14px; font-size:15px; line-height:1.6; color:#E8E0BC; max-width:30ch; }
    .panel .pie { position:relative; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:#BFCBA8; margin-top:44px; }
    .panel .pie b { color:var(--crema); }
    .formulario { padding:52px 48px; }
    .formulario h2 { font-family:'Fraunces',serif; font-weight:500; font-size:21px; margin-bottom:4px; }
    .ayuda { font-size:13.5px; color:var(--texto-suave); margin-bottom:24px; }
    .aviso {
      display:none;
      padding:12px 14px;
      margin-bottom:20px;
      border-radius:10px;
      font-size:13px;
      line-height:1.45;
      background:#FFF2EA;
      border:1px solid #EDC6AD;
      color:#7A3515;
    }
    .aviso.visible { display:block; }
    .aviso.error { background:#FFF0EF; border-color:#E7B8B4; color:var(--error); }
    .fila { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .campo { margin-bottom:18px; }
    label { display:block; font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--texto-suave); margin-bottom:7px; }
    input, select {
      width:100%;
      padding:13px 15px;
      border:1.5px solid var(--borde);
      border-radius:11px;
      font:15px 'Inter',sans-serif;
      color:var(--texto);
      background:#FCFCFA;
      transition:border-color .18s,box-shadow .18s;
    }
    input:focus, select:focus { outline:none; border-color:var(--verde-fruto); box-shadow:0 0 0 3px rgba(95,168,50,.16); }
    input:disabled, select:disabled { color:#8A9484; background:#F3F5F0; cursor:not-allowed; }
    button {
      width:100%;
      margin-top:10px;
      padding:16px;
      background:var(--verde-hoja);
      color:var(--crema);
      border:0;
      border-radius:12px;
      cursor:pointer;
      font:600 15.5px 'Inter',sans-serif;
      letter-spacing:.02em;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:background .2s,transform .12s;
    }
    button:hover { background:#153619; }
    button:active { transform:scale(.985); }
    button:disabled { opacity:.62; cursor:wait; }
    .punto { width:8px; height:8px; border-radius:50%; background:var(--terracota); }
    .privacidad { margin-top:16px; color:#7B8577; font-size:11.5px; line-height:1.5; text-align:center; }
    .honeypot { position:absolute!important; left:-10000px!important; width:1px!important; height:1px!important; overflow:hidden!important; }
    .exito { display:none; text-align:center; padding:70px 48px; animation:aparecer .5s ease; }
    .check { width:84px; height:84px; margin:0 auto 26px; border-radius:50%; background:var(--verde-fruto); display:flex; align-items:center; justify-content:center; }
    .check svg { width:40px; height:40px; stroke:var(--blanco); stroke-width:3; fill:none; }
    .exito h2 { font-family:'Fraunces',serif; font-weight:600; font-size:27px; margin-bottom:12px; }
    .exito p { font-size:15px; color:var(--texto-suave); line-height:1.65; max-width:42ch; margin:0 auto; }
    .video-tag { display:inline-flex; align-items:center; gap:8px; margin-top:26px; background:var(--crema); color:var(--verde-hoja); padding:9px 18px; border-radius:100px; font-size:13px; font-weight:600; }
    #submitFrame { display:none; width:0; height:0; border:0; }
    @keyframes aparecer { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @media(max-width:820px) {
      body { padding:14px; }
      .tarjeta { grid-template-columns:1fr; }
      .panel { padding:38px 30px; }
      .panel h1 { margin-top:24px; }
      .formulario { padding:36px 26px; }
      .fila { grid-template-columns:1fr; gap:0; }
    }
    @media(prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="tarjeta">
    <aside class="panel">
      <svg class="surcos" viewBox="0 0 600 300" aria-hidden="true">
        <path d="M0 260 Q300 120 600 260" stroke="#F3E5A5" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M0 300 Q300 175 600 300" stroke="#5FA832" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M40 340 Q300 230 560 340" stroke="#F3E5A5" stroke-width="26" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="logo-caja"><img src="logo.png" alt="Avovite"></div>
        <h1 id="titulo"></h1>
        <p class="sub" id="subtitulo"></p>
      </div>
      <p class="pie"><b>Avovite</b></p>
    </aside>

    <section class="formulario" id="zonaForm">
      <h2>Tus datos</h2>
      <p class="ayuda">Completa la información y elige un horario disponible.</p>
      <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

      <form id="reservaForm" novalidate>
        <div class="honeypot" aria-hidden="true">
          <label for="empresa">Empresa</label>
          <input id="empresa" name="empresa" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div class="fila">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required maxlength="80" autocomplete="given-name" placeholder="Ej: Laura">
          </div>
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input id="apellido" name="apellido" type="text" required maxlength="80" autocomplete="family-name" placeholder="Ej: Gómez">
          </div>
        </div>
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" required maxlength="160" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="campo">
          <label for="telefono">Teléfono / WhatsApp</label>
          <input id="telefono" name="telefono" type="tel" required maxlength="30" autocomplete="tel" placeholder="Ej: 310 000 0000">
        </div>
        <div class="fila">
          <div class="campo">
            <label for="fecha">Fecha de la reunión</label>
            <input id="fecha" name="fecha" type="date" required disabled>
          </div>
          <div class="campo">
            <label for="hora">Hora</label>
            <select id="hora" name="hora" required disabled>
              <option value="">Selecciona primero una fecha</option>
            </select>
          </div>
        </div>
        <button id="btnEnviar" type="submit" disabled>
          <span class="punto"></span><span id="btnTexto"></span>
        </button>
        <p class="privacidad">Tus datos se usarán únicamente para gestionar esta reunión y enviar su confirmación.</p>
      </form>
    </section>

    <section class="exito" id="zonaExito" aria-live="polite">
      <div class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg></div>
      <h2 id="exitoTitulo"></h2>
      <p id="exitoTexto"></p>
      <span class="video-tag">🎬 Tu video personalizado está en camino</span>
    </section>
  </main>

  <iframe id="submitFrame" name="submitFrame" title="Envío de reserva"></iframe>

  <script>
    'use strict';
    const state = { availability: null, pendingNonce: '', timeoutId: null };
    const $ = id => document.getElementById(id);

    $('titulo').textContent = CONFIG.TITULO;
    $('subtitulo').textContent = CONFIG.SUBTITULO;
    $('btnTexto').textContent = CONFIG.BOTON;
    $('exitoTitulo').textContent = CONFIG.MENSAJE_EXITO_TITULO;
    $('exitoTexto').textContent = CONFIG.MENSAJE_EXITO_TEXTO;

    function configured() {
      return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(CONFIG.SCRIPT_URL);
    }

    function localDateString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function showNotice(message, isError = false) {
      const notice = $('aviso');
      notice.textContent = message;
      notice.className = `aviso visible${isError ? ' error' : ''}`;
    }

    function clearNotice() {
      $('aviso').className = 'aviso';
      $('aviso').textContent = '';
    }

    function jsonp(params, timeout = 12000) {
      return new Promise((resolve, reject) => {
        const callback = `avoviteCb_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        const timer = setTimeout(() => finish(new Error('La consulta de disponibilidad tardó demasiado.')), timeout);
        function finish(error, data) {
          clearTimeout(timer);
          delete window[callback];
          script.remove();
          error ? reject(error) : resolve(data);
        }
        window[callback] = data => finish(null, data);
        script.onerror = () => finish(new Error('No fue posible consultar la disponibilidad.'));
        const query = new URLSearchParams({ ...params, callback });
        script.src = `${CONFIG.SCRIPT_URL}?${query}`;
        document.head.appendChild(script);
      });
    }

    async function loadCalendar() {
      if (!configured()) {
        showNotice('El formulario todavía está en configuración. Intenta nuevamente más tarde.', true);
        return;
      }
      try {
        const data = await jsonp({ action: 'availability' });
        if (!data.ok) throw new Error(data.message || 'No fue posible cargar la agenda.');
        state.availability = data;
        if (!data.agendaActiva) {
          showNotice('La agenda está temporalmente cerrada. Intenta nuevamente más tarde.');
          return;
        }
        const today = new Date();
        const maxDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + Number(data.diasMaximoAdelanto || 60));
        $('fecha').min = localDateString(today);
        $('fecha').max = localDateString(maxDate);
        $('fecha').disabled = false;
        showNotice('Selecciona una fecha para ver únicamente los horarios disponibles.');
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    async function loadTimes() {
      const date = $('fecha').value;
      $('hora').disabled = true;
      $('btnEnviar').disabled = true;
      $('hora').innerHTML = '<option value="">Consultando horarios…</option>';
      clearNotice();
      if (!date) return;

      try {
        const data = await jsonp({ action: 'availability', fecha: date });
        if (!data.ok) throw new Error(data.message || 'No fue posible consultar la fecha.');
        const times = data.horariosDisponibles || [];
        if (!times.length) {
          $('hora').innerHTML = '<option value="">No hay espacios disponibles</option>';
          showNotice('No quedan horarios disponibles para esta fecha. Elige otro día.');
          return;
        }
        $('hora').innerHTML = '<option value="" disabled selected>Selecciona</option>' +
          times.map(time => `<option value="${time}">${time}</option>`).join('');
        $('hora').disabled = false;
        $('btnEnviar').disabled = false;
      } catch (error) {
        $('hora').innerHTML = '<option value="">No disponible</option>';
        showNotice(error.message, true);
      }
    }

    function setSending(sending) {
      $('btnEnviar').disabled = sending;
      $('btnTexto').textContent = sending ? 'Confirmando…' : CONFIG.BOTON;
    }

    function submitBooking() {
      const form = $('reservaForm');
      if (!form.reportValidity()) return;
      clearNotice();
      setSending(true);

      const nonce = `${Date.now()}_${Math.random().toString(36).slice(2)}_${Math.random().toString(36).slice(2)}`;
      state.pendingNonce = nonce;
      clearTimeout(state.timeoutId);
      state.timeoutId = setTimeout(async () => {
        if (state.pendingNonce !== nonce) return;
        showNotice('Estamos verificando que la reserva haya quedado guardada…');
        try {
          const status = await jsonp({ action: 'bookingStatus', nonce }, 15000);
          if (state.pendingNonce !== nonce) return;
          if (!status.pending && status.ok) {
            state.pendingNonce = '';
            $('zonaForm').style.display = 'none';
            $('zonaExito').style.display = 'block';
            return;
          }
          if (!status.pending && !status.ok) throw new Error(status.message || 'No fue posible reservar este horario.');
          throw new Error('El servidor sigue procesando. Revisa la agenda antes de enviar nuevamente.');
        } catch (error) {
          if (state.pendingNonce !== nonce) return;
          showNotice(error.message || 'No pudimos verificar la reserva. Revisa la agenda antes de intentar nuevamente.', true);
        }
        state.pendingNonce = '';
        setSending(false);
      }, 20000);

      const postForm = document.createElement('form');
      postForm.method = 'POST';
      postForm.action = CONFIG.SCRIPT_URL;
      postForm.target = 'submitFrame';
      postForm.style.display = 'none';
      const data = new FormData(form);
      data.set('nonce', nonce);
      data.forEach((value, key) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        postForm.appendChild(input);
      });
      document.body.appendChild(postForm);
      postForm.submit();
      postForm.remove();
    }

    window.addEventListener('message', event => {
      const data = event.data;
      if (!data || data.source !== 'avovite-agenda' || data.nonce !== state.pendingNonce) return;
      clearTimeout(state.timeoutId);
      state.pendingNonce = '';
      if (data.ok) {
        $('zonaForm').style.display = 'none';
        $('zonaExito').style.display = 'block';
        return;
      }
      setSending(false);
      showNotice(data.message || 'No fue posible reservar este horario.', true);
      if (data.code === 'ESPACIO_OCUPADO' || data.code === 'ESPACIO_NO_DISPONIBLE') loadTimes();
    });

    $('fecha').addEventListener('change', loadTimes);
    $('reservaForm').addEventListener('submit', event => {
      event.preventDefault();
      submitBooking();
    });
    loadCalendar();
  </script>
</body>
</html>
